name: POSTOR

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If you use React Native, Flutter, or CocoaPods, add your dependency installation steps here.
      # Example for native iOS/Swift apps utilizing CocoaPods:
      # - name: Install Pods
      #   run: pod install

      - name: Build Xcode Archive (No Signing)
        run: |
          xcodebuild archive \
            -project YourProjectName.xcodeproj \
            -scheme YourProjectName \
            -configuration Release \
            -archivePath build/YourProjectName.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Packaging .app into .ipa
        run: |
          # 1. Create a Payload folder
          mkdir -p build/ipa/Payload
          
          # 2. Find the compiled .app file inside the archive and copy it over
          APP_PATH=$(find build/YourProjectName.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          cp -r "$APP_PATH" build/ipa/Payload/
          
          # 3. Zip up the Payload folder and rename the extension to .ipa
          cd build/ipa
          zip -r YourAppName_Unsigned.ipa Payload
          
          echo "✅ Unsigned IPA created successfully."

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-Sideload-IPA
          path: build/ipa/YourAppName_Unsigned.ipa
